# Source: mesure-impact-dev/charts/mesure-impact/templates/web.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesure-impact-web
  labels:
    app.kubernetes.io/name: mesure-impact
    app.kubernetes.io/instance: mesure-impact
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "sha-1fb48eeb2db2ca8738ebdc03b596917c97901e40"
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mesure-impact
      app.kubernetes.io/instance: mesure-impact
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mesure-impact
        app.kubernetes.io/instance: mesure-impact
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "sha-1fb48eeb2db2ca8738ebdc03b596917c97901e40"
        app.kubernetes.io/component: web
    spec:
      # Aucun appel à l'API Kubernetes : pas de token de SA monté.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/socialgouv/mesure-impact-web:sha-1fb48eeb2db2ca8738ebdc03b596917c97901e40
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }


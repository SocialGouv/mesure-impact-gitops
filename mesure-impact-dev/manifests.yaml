# Source: mesure-impact-dev/charts/mesure-impact/templates/alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mesure-impact-collecte
  labels:
    app.kubernetes.io/name: mesure-impact
    app.kubernetes.io/instance: mesure-impact
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "sha-6f3afb698cef402336c88c3f199cad558458d445"
    prometheus/rules: infra
spec:
  groups:
    - name: mesure-impact-collecte
      rules:
        - alert: MesureImpactCollecteEnEchec
          # Borné à la fenêtre récente : `kube_job_status_failed > 0` reste vrai tant
          # que l'objet Job existe, et failedJobsHistoryLimit le conserve jusqu'à trois
          # échecs suivants — l'alerte ne se résoudrait jamais après un échec isolé.
          # `max by` déduplique : plusieurs exportateurs publient la même métrique
          # (kube-state-metrics, kubernetes-pods, kubecost…), soit autant d'alertes
          # identiques pour un seul job en échec.
          expr: |
            max by (namespace, job_name) (
              kube_job_status_failed{namespace="mesure-impact-dev", job_name=~"mesure-impact-.*"}
            ) > 0
            and on (namespace, job_name) (
              time() - max by (namespace, job_name) (kube_job_created{namespace="mesure-impact-dev"})
              < 86400
            )
          for: 15m
          labels:
            severity: warning
            environnement: "dev"
          annotations:
            summary: "Collecte {{ $labels.job_name }} en échec"
            description: >-
              Le job {{ $labels.job_name }} du namespace mesure-impact-dev
              a échoué. Le tableau de bord concerné n'est plus alimenté.

        # kube_cronjob_status_last_successful_time n'est PAS exporté tant qu'un
        # CronJob n'a jamais réussi. La seule expression « trop vieux » serait donc
        # aveugle au cas le plus grave : celui qui n'a jamais collecté. D'où la
        # seconde branche, qui repère les CronJobs connus et sans succès, en
        # excluant ceux qu'on a délibérément suspendus.
        - alert: MesureImpactCollecteMuette
          expr: |
            (
              time() - max by (cronjob) (
                kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev", cronjob=~"mesure-impact-.*"}
              ) > 172800
              unless on (cronjob) (kube_cronjob_spec_suspend{namespace="mesure-impact-dev"} == 1)
            )
            or
            (
              max by (cronjob) (kube_cronjob_info{namespace="mesure-impact-dev", cronjob=~"mesure-impact-.*"})
              unless on (cronjob) kube_cronjob_status_last_successful_time{namespace="mesure-impact-dev"}
              unless on (cronjob) (kube_cronjob_spec_suspend{namespace="mesure-impact-dev"} == 1)
              and on (cronjob) (
                time() - max by (cronjob) (kube_cronjob_created{namespace="mesure-impact-dev", cronjob=~"mesure-impact-.*"})
                > 172800
              )
            )
          for: 30m
          labels:
            severity: warning
            environnement: "dev"
          annotations:
            summary: "Collecte {{ $labels.cronjob }} sans succès depuis trop longtemps"
            description: >-
              Aucune collecte réussie pour {{ $labels.cronjob }} depuis plus de
              48 h. Panne silencieuse probable :
              les données affichées vieillissent sans que rien ne casse.

# Source: mesure-impact-dev/charts/mesure-impact/templates/cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mesure-impact-sante-basavi-collect
  labels:
    app.kubernetes.io/name: mesure-impact
    app.kubernetes.io/instance: mesure-impact
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "sha-6f3afb698cef402336c88c3f199cad558458d445"
    app.kubernetes.io/component: collect
    mesure-impact/produit: sante-basavi
spec:
  schedule: "0 6 * * *"
  timeZone: "Europe/Paris"
  suspend: true
  concurrencyPolicy: Forbid
  # Sans cette borne, un contrôleur indisponible plusieurs heures accumule les
  # démarrages manqués ; passé 100, le CronJob cesse définitivement d'être planifié.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mesure-impact
            app.kubernetes.io/instance: mesure-impact
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/version: "sha-6f3afb698cef402336c88c3f199cad558458d445"
            app.kubernetes.io/component: collect
            mesure-impact/produit: sante-basavi
        spec:
          restartPolicy: OnFailure
          # Aucun appel à l'API Kubernetes : pas de token de SA monté.
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collect
              image: ghcr.io/socialgouv/mesure-impact-cron:sha-6f3afb698cef402336c88c3f199cad558458d445
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              # Les deux seuls vrais secrets : tokens Matomo et Grist du produit.
              envFrom:
                - secretRef:
                    name: mesure-impact-sante-basavi-tokens
              # Config non sensible : elle vient de produit.yaml, relisible en PR.
              env:
                - name: PRODUIT
                  value: "sante/basavi"
                - name: ENVIRONMENT
                  value: "dev"
                - name: RUN_ID
                  value: "basavi"
                - name: MATOMO_URL
                  value: "https://matomo.fabrique.social.gouv.fr"
                - name: MATOMO_SITE_ID
                  value: "168"
                - name: GRIST_URL
                  value: "https://grist.numerique.gouv.fr"
                - name: GRIST_DOC_ID
                  value: "1kb1wHNCjAns"
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}


---
# Source: mesure-impact-prod/charts/mesure-impact/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mesure-impact-ingress
  labels:
    app.kubernetes.io/name: mesure-impact
    app.kubernetes.io/instance: mesure-impact
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: ""
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              network-policy/source: ingress-controller
    - from:
        - namespaceSelector:
            matchLabels:
              network-policy/source: monitoring

---
# Source: mesure-impact-prod/charts/mesure-impact/templates/web.yaml

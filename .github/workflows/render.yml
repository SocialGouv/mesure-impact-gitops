name: Render

on:
  # Entrée 1 — le dépôt applicatif signale une livraison en passant la version.
  # Demande une identité côté appelant (GitHub n'a pas d'équivalent du CI_JOB_TOKEN
  # de GitLab, cf. README). Non câblée à ce jour.
  repository_dispatch:
    types: [livraison]

  # Entrée 2 — ce dépôt va chercher lui-même la dernière version publiée sur ghcr.
  # Aucun secret partagé, aucune identité à distribuer. C'est le chemin actif.
  schedule:
    - cron: "*/15 * * * *"

  # Entrée 3 — édition directe des sources : un host, du scaling, une cadence.
  push:
    branches: [main]
    paths: ["apps/**"]

  workflow_dispatch:
    inputs:
      chart_version:
        description: "Version à épingler (0.0.0-sha.xxxxxxxx). Vide = dernière publiée."
        required: false
      environment:
        description: Environnement à épingler
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  CHART: mesure-impact/charts/mesure-impact
  # L'auto-suivi ne concerne que dev. La prod s'épingle délibérément, à la main ou
  # par dispatch : c'est le seul garde-fou entre « livré » et « en production ».
  AUTO_ENV: dev

jobs:
  render:
    name: Rendre les manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      - uses: azure/setup-helm@v4

      - name: Résoudre la version à épingler
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_VERSION: ${{ github.event.client_payload.chart_version }}
          INPUT_VERSION: ${{ github.event.inputs.chart_version }}
          DISPATCH_ENV: ${{ github.event.client_payload.environment }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-${INPUT_VERSION:-}}"
          cible="${DISPATCH_ENV:-${INPUT_ENV:-}}"

          if [ -z "$version" ]; then
            # Dernière version publiée sur ghcr. Le package est public : pas de
            # credential du dépôt applicatif à détenir ici.
            version=$(gh api "/orgs/SocialGouv/packages/container/$(printf %s "$CHART" | sed 's|/|%2F|g')/versions" \
              --jq '[.[].metadata.container.tags[]? | select(startswith("0.0.0-sha."))][0] // ""')
            cible="${cible:-$AUTO_ENV}"
          fi

          [ -n "$version" ] || { echo "::error::aucune version de chart trouvée sur ghcr"; exit 1; }
          # Format strict : sans ça, un dispatch pourrait épingler n'importe quoi.
          case "$version" in
            0.0.0-sha.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) : ;;
            *) echo "::error::version « $version » hors format 0.0.0-sha.<sha8>"; exit 1 ;;
          esac
          case "${cible:-dev}" in dev|prod) : ;; *) echo "::error::env « $cible » inconnu"; exit 1 ;; esac

          echo "version=$version"        >> "$GITHUB_OUTPUT"
          echo "cible=${cible:-dev}"     >> "$GITHUB_OUTPUT"
          echo "Épinglage $version sur mesure-impact-${cible:-dev}"

      - name: Épingler dans les sources
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          chart="apps/mesure-impact-${{ steps.version.outputs.cible }}/Chart.yaml"
          [ -f "$chart" ] || { echo "::error::$chart introuvable"; exit 1; }
          sed -i "s|^\( *version: \)0\.0\.0-sha\..*|\1${{ steps.version.outputs.version }}|" "$chart"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$chart"
          if git diff --cached --quiet; then
            echo "déjà à cette version"
          else
            # [skip ci] : le rendu tourne dans CE pipeline, un push relancerait en boucle.
            git commit -m "chore: pin ${{ steps.version.outputs.cible }} sur ${{ steps.version.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Rendre chaque environnement
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

          rm -rf rendu && mkdir -p rendu
          echec=0
          for dossier in apps/*/; do
            nom=$(basename "$dossier")
            # Un dossier incomplet est ignoré : mieux vaut ne pas rendre que rendre à moitié.
            [ -f "$dossier/Chart.yaml" ] || { echo "::warning::$nom sans Chart.yaml, ignoré"; continue; }
            [ -f "$dossier/env.yaml" ]   || { echo "::warning::$nom sans env.yaml, ignoré";   continue; }
            grep -q 'PLACEHOLDER' "$dossier/Chart.yaml" && { echo "::warning::$nom pas encore épinglé, ignoré"; continue; }

            ns=$(yq -r '.namespace' "$dossier/env.yaml")
            [ -n "$ns" ] && [ "$ns" != "null" ] || { echo "::error::$nom : namespace absent de env.yaml"; echec=1; continue; }

            echo "::group::$nom -> $ns"
            # `dependency update`, pas `build` : encaisse un changement de version épinglée.
            if ! helm dependency update "$dossier" >/dev/null; then
              echo "::error::$nom : dépendance OCI introuvable"; echec=1; echo "::endgroup::"; continue
            fi
            # Nom de release CONSTANT `mesure-impact`, jamais le nom du dossier : le
            # selector d'un Deployment est immuable et contient app.kubernetes.io/instance.
            if ! helm template mesure-impact "$dossier" \
                   --namespace "$ns" \
                   --values "$dossier/values.deploy.yaml" > "rendu/$nom.yaml"; then
              echo "::error::$nom : rendu en échec"; echec=1; rm -f "rendu/$nom.yaml"
            else
              # Les manifests ne portent volontairement aucun `namespace:` : c'est ce
              # qui les rend rejouables. L'apply doit donc savoir où les poser, et le
              # déduire du nom de dossier serait une convention tacite de plus.
              echo "$ns" > "rendu/$nom.namespace"
            fi
            echo "::endgroup::"
          done
          # Un env en échec ne doit pas emporter les autres, mais doit se voir.
          [ "$echec" = 0 ] || { echo "::error::au moins un environnement n'a pas pu être rendu"; exit 1; }
          ls -1 rendu/

      - name: Publier sur la branche rendered
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp -r rendu /tmp/rendu
          git fetch origin rendered 2>/dev/null && git checkout -q rendered || git checkout -q --orphan rendered
          git rm -rqf . 2>/dev/null || true
          rm -rf apps .github rendu

          for f in /tmp/rendu/*.yaml; do
            nom=$(basename "$f" .yaml)
            mkdir -p "$nom"
            cp "$f" "$nom/manifests.yaml"
            cp "/tmp/rendu/$nom.namespace" "$nom/namespace"
          done
          rm -rf /tmp/rendu

          git add -A
          if git diff --cached --quiet; then
            echo "rendu inchangé"
          else
            git commit -m "render: manifests de ${{ github.sha }}"
            git push origin rendered
          fi
